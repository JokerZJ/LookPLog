# Cloudflare Workers + 静态资源（Vite 产物在 dist）
# 控制台：
#   Build command:  npm run build
#   Deploy command: npx wrangler deploy
#   Root directory: 留空或 .

name = "lookplog"
compatibility_date = "2024-11-12"

# SPA：未匹配路径回退到 index.html（不要再用 public/_redirects，会与此冲突）
[assets]
directory = "./dist"
not_found_handling = "single-page-application"
